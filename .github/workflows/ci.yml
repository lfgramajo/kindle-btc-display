name: Materialize v1.7.0 staging

on:
  push:
    branches:
      - release/v1.7.0-build
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1.7.0-build
      - name: Materialize final source
        shell: bash
        run: |
          set -e
          printf '\n' >> .release/app.patch
          git apply --check .release/app.patch
          git apply .release/app.patch
          cp .release/ci-final.yml .github/workflows/ci.yml
          rm -rf .release
          chmod +x install.sh uninstall.sh
          printf '%s  app.py\n' '006666276f8360cf5b010e9c8e1a0d20765e427e7341f89c278798e0cb32863c' | sha256sum -c -
          sha256sum -c RELEASE_MANIFEST.sha256
          python -m py_compile app.py
          bash -n install.sh
          bash -n uninstall.sh
          python tests/opsec_scan.py
      - name: Commit materialized source
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize v1.7.0 release source'
          git push origin HEAD:release/v1.7.0-build
