name: GTQ publication validation

on:
  push:
    branches:
      - fix/gtq-publication

permissions:
  contents: write

jobs:
  patch-validate-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply bounded GTQ patch
        run: python patch_gtq_publication.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and shell validation
        run: |
          python -m py_compile app.py
          bash -n install.sh
          bash -n uninstall.sh
      - name: Verify GTQ runtime path without network
        run: python -c "from unittest.mock import patch; import app; assert app.normalize_secondary_fiat('gtq') == 'GTQ'; cfg={'secondary_fiat':'GTQ','usd_mxn_fallback_rate':16.92}; payload={'bitcoin':{'usd':100000,'gtq':765000,'usd_24h_change':1.25}}; p=patch.object(app,'request_json',return_value=payload); m=p.start(); r=app.fetch_btc_main_coingecko(cfg); p.stop(); assert r['price_secondary']==765000 and r['secondary_fiat']=='GTQ'; assert m.call_args.kwargs['params']['vs_currencies']=='usd,gtq'; print('GTQ_RUNTIME_PATH=PASS')"
      - name: Docker build
        run: docker build -t kindle-btc-display:gtq-publication .
      - name: Final public-tree hygiene
        run: |
          test ! -d tests
          test ! -f RELEASE_MANIFEST.sha256
          test ! -f CONTRIBUTING.md
          test ! -f docs/PROVENANCE.md
          test ! -f docs/RELEASE_PROCESS.md
          ! grep -R -n -E '192\.168\.[0-9]{1,3}\.[0-9]{1,3}|[A-Za-z0-9._-]+\.home\.arpa|/home/[A-Za-z0-9._-]+' --exclude-dir=.git --exclude='gtq-publication.yml' .
      - name: Commit validated final tree and remove temporary validation files
        run: |
          rm -f patch_gtq_publication.py .github/workflows/gtq-publication.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add GTQ support and publication docs'
          git push origin HEAD:fix/gtq-publication
