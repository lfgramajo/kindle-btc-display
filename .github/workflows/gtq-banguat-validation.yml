name: GTQ Banguat validation

on:
  push:
    branches:
      - fix/gtq-banguat-fallback

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply bounded patch
        run: python patch_gtq_banguat.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and shell validation
        run: |
          python -m py_compile app.py
          bash -n install.sh
          bash -n uninstall.sh
      - name: Mock GTQ fallback behavior
        env:
          APP_BASE_DIR: /tmp/kindle-gtq-mock
        run: python -c "from unittest.mock import patch; import app; cfg={'secondary_fiat':'GTQ','usd_mxn_fallback_rate':16.92}; usd=app._main_result(100000,None,'GTQ',1.0,1000,'coingecko'); p1=patch.object(app,'fetch_btc_main_coingecko',return_value=usd); p2=patch.object(app,'fetch_usd_gtq_banguat',return_value=7.6273); a=p1.start(); b=p2.start(); r=app.fetch_btc_main_live(cfg); p2.stop(); p1.stop(); assert r['price_secondary']==762730 and r['secondary_fiat']=='GTQ' and r['provider']=='coingecko+banguat'; print('GTQ_MOCK_FALLBACK=PASS')"
      - name: Live Banco de Guatemala rate
        env:
          APP_BASE_DIR: /tmp/kindle-gtq-live
        run: python -c "import app; r=app.fetch_usd_gtq_banguat(); print('BANGUAT_USD_GTQ_REFERENCE='+str(r)); assert r is not None and 5 < r < 10; print('BANGUAT_LIVE=PASS')"
      - name: Docker build
        run: docker build -t kindle-btc-display:gtq-banguat .
      - name: Live GTQ runtime provider path in built image
        run: docker run --rm kindle-btc-display:gtq-banguat python -c "import app; cfg={'secondary_fiat':'GTQ','usd_mxn_fallback_rate':16.92}; r=app.fetch_btc_main_live(cfg); print(r); assert r and isinstance(r.get('price_usd'),(int,float)) and r['price_usd']>0; assert isinstance(r.get('price_secondary'),(int,float)) and r['price_secondary']>0; assert r.get('secondary_fiat')=='GTQ'; print('GTQ_LIVE_RUNTIME=PASS')"
      - name: Final public-tree hygiene
        run: |
          test ! -d tests
          test ! -f RELEASE_MANIFEST.sha256
          test ! -f CONTRIBUTING.md
          test ! -f docs/PROVENANCE.md
          test ! -f docs/RELEASE_PROCESS.md
          ! grep -R -n -E '192\.168\.[0-9]{1,3}\.[0-9]{1,3}|[A-Za-z0-9._-]+\.home\.arpa|/home/[A-Za-z0-9._-]+' --exclude-dir=.git --exclude='gtq-banguat-validation.yml' .
      - name: Commit validated tree and remove temporary validation files
        run: |
          rm -f patch_gtq_banguat.py .github/workflows/gtq-banguat-validation.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Banco de Guatemala GTQ fallback'
          git push origin HEAD:fix/gtq-banguat-fallback
